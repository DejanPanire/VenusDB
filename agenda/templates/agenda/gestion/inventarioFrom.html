{% extends "agenda/base.html" %}
{% load static %}

{% block title %}{{ titulo }} · Centro Estético Antonia{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="main-container p-4">
                <h3 class="fw-bold mb-4" style="color: #4a2e35;">{{ titulo }}</h3>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn-pink-antonia px-4">Guardar Registro</button>
                        <a href="{% url 'inventario' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
