<div class="campo {% if campo.field.widget.input_type == 'checkbox' %}campo-check{% endif %} {% if campo.name == 'descripcion' %}campo-ancho{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}
  <label>{{ campo }} {{ campo.label }}</label>
  {% else %}
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% endif %}
  {% if campo.help_text %}<p class="nota">{{ campo.help_text }}</p>{% endif %}
  {% for e in campo.errors %}<p class="error-campo">{{ e }}</p>{% endfor %}
</div>
