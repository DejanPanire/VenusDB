{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Centro Estético Antonia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <div class="navbar-antonia d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <img src="{% static 'img/logoAntonia.jpeg' %}" alt="Logo Antonia" style="height: 40px; object-fit: contain;">
            <a href="#" class="brand-title text-decoration-none">Centro Estético Antonia</a>
        </div>
        <div class="d-flex align-items-center gap-4">
            <a href="#" class="nav-link-antonia">Dashboard</a>
            <a href="#" class="nav-link-antonia">Reservas</a>
            <a href="#" class="nav-link-antonia">Clientes</a>
            <a href="#" class="nav-link-antonia">Cierre de Caja</a>
            <a href="{% url 'inventario_list' %}" class="nav-link-antonia active fw-bold">Inventario</a>
            <a class="nav-link active" href="{% url 'personal_list' %}">Personal</a>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-dark border">Admin</span>
        </div>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="main-container p-4">
                    <h3 class="fw-bold mb-4" style="color: #4a2e35;">{{ titulo }}</h3>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <!-- Renderizado de campos del formulario con clases de Bootstrap -->
                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <button type="submit" class="btn-pink-antonia px-4">Guardar Registro</button>
                            <a href="{% url 'inventario_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'JS/funciones.js' %}"></script>
</body>
</html>
